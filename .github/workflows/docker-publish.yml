name: Docker Publish

on:
  workflow_call:
    inputs:
      registry:
        required: true
        type: string
      registry_username:
        required: false
        type: string
        default: registry
      image_tags:
        required: true
        type: string
      # Immutable local image (e.g. local/name:<sha>) to retag each image_tag
      # from just before pushing. Guards against pushing a mutable tag like
      # :latest that a concurrent run re-pointed on the shared runner. When
      # empty, tags are pushed as-is (legacy behavior).
      source_image:
        required: false
        type: string
        default: ""
    secrets:
      REGISTRY_PASSWORD:
        required: true

jobs:
  docker-publish:
    runs-on: self-hosted

    steps:
      - name: Refuse to publish from non-main refs
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Refusing to publish images from '${GITHUB_REF}' — publishing is only allowed from refs/heads/main." >&2
          exit 1

      - name: Login to registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry_username }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Push Docker image tags
        env:
          IMAGE_TAGS: ${{ inputs.image_tags }}
          SOURCE_IMAGE: ${{ inputs.source_image }}
        run: |
          set -euo pipefail

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            if [ -n "$SOURCE_IMAGE" ]; then
              docker tag "$SOURCE_IMAGE" "$tag"
            fi
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
